<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TonuControle">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../../icons/icon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../icons/icon-72x72.png">
    <link rel="icon" type="image/png" sizes="128x128" href="../../icons/icon-128x128.png">
    <link rel="shortcut icon" href="../../icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../icons/icon-192x192.png">
    <title>TonuControle - Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/dark-theme.css">
    <link rel="stylesheet" href="../../css/mobile.css">
    <link rel="stylesheet" href="../../css/notifications.css">
    <link rel="stylesheet" href="../../css/sync-status.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .skip-link {
            position: absolute; top: -100%; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: #6C5CE7; color: #fff; border-radius: 8px;
            z-index: 999999; font-weight: 600; text-decoration: none;
        }
        .skip-link:focus { top: 16px; }
        .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: #6C5CE7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

<!-- TOPBAR -->
<header class="mobile-topbar">
    <div class="topbar-header">
        <div class="topbar-left">
            <div class="app-icon"><img src="../../icons/logo.png" alt="TonuControle"></div>
            <h1>Tonu<span>Controle</span></h1>
        </div>
        <div class="topbar-actions">
            <button class="topbar-btn theme-toggle-btn" onclick="toggleTheme()" title="Alternar Modo Escuro / Claro" aria-label="Alternar tema">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            <button class="topbar-btn" id="notifBellBtn" onclick="window.toggleNotificationDropdown(event)" title="Lembretes e Notificações" aria-label="Notificações">
                <i class="fas fa-bell"></i>
                <span class="notif-badge hidden" id="notifBadgeCount">0</span>
            </button>
            <button class="topbar-btn" onclick="window.tonuSync && window.tonuSync.syncPendingData ? window.tonuSync.syncPendingData() : location.reload()" title="Sincronizar" aria-label="Sincronizar">
                <i class="fas fa-sync-alt"></i>
            </button>
            <a href="settings.html" id="mobileTopAvatar" class="mobile-topbar-avatar" title="Perfil e Status de Sincronização" aria-label="Perfil">
                <span id="topbarAvatar">U</span>
            </a>
        </div>
    </div>
    <div class="greeting" id="greetingText">Olá, Usuário 👋</div>
</header>

<!-- CONTEÚDO -->
<main class="mobile-content" id="main-content">
    <!-- SELETOR DE MÊS -->
    <div class="mobile-month-selector-bar">
        <div class="month-selector">
            <button class="month-nav" onclick="changeMonth(-1)" aria-label="Mês anterior">
                <i class="fas fa-chevron-left"></i>
            </button>
            <span class="month-label" id="selectedMonth">Carregando...</span>
            <button class="month-nav" onclick="changeMonth(1)" aria-label="Próximo mês">
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="btn-today" onclick="goToCurrentMonth()">Hoje</button>
        </div>
    </div>

    <!-- BALANÇO HERO & CARDS -->
    <div id="summaryContainer"></div>

    <!-- AÇÕES RÁPIDAS -->
    <div class="mobile-quick-actions">
        <button class="quick-action-btn" onclick="openQuickAddModal('expense')">
            <i class="fas fa-arrow-down" style="color: #FF7675;"></i>
            <span>Nova Despesa</span>
        </button>
        <button class="quick-action-btn" onclick="openQuickAddModal('income')">
            <i class="fas fa-arrow-up" style="color: #00B894;"></i>
            <span>Nova Receita</span>
        </button>
        <a href="bills.html" class="quick-action-btn">
            <i class="fas fa-file-invoice-dollar" style="color: #FDCB6E;"></i>
            <span>Contas</span>
        </a>
        <a href="investments.html" class="quick-action-btn">
            <i class="fas fa-chart-line" style="color: #6C5CE7;"></i>
            <span>Investir</span>
        </a>
        <a href="goals.html" class="quick-action-btn">
            <i class="fas fa-bullseye" style="color: #0984E3;"></i>
            <span>Metas</span>
        </a>
    </div>

    <!-- GRÁFICO INTERATIVO MOBILE (FLUXO & CATEGORIAS) -->
    <div id="mobileChartContainer"></div>

    <!-- DIAGNÓSTICO 360º & INSIGHTS MOBILE -->
    <div id="mobileInsightsContainer"></div>

    <!-- METAS EM DESTAQUE MOBILE -->
    <div id="mobileGoalsContainer"></div>

    <!-- ÚLTIMAS TRANSAÇÕES -->
    <div class="mobile-section-title">
        <span>📋 Últimas Transações</span>
        <a href="transactions.html">Ver todas →</a>
    </div>
    <div id="mobileTransactions">
        <div style="text-align:center;padding:20px;">
            <span class="spinner"></span>
            <p style="margin-top:8px;font-size:13px;color:#94a3b8;">Carregando dados...</p>
        </div>
    </div>
</main>

<!-- BOTTOM SHEET MODAL (ADICIONAR TRANSAÇÃO RÁPIDA) -->
<div class="mobile-modal-overlay" id="quickAddModal" onclick="closeQuickAddModal(event)">
    <div class="mobile-modal-sheet" onclick="event.stopPropagation()">
        <div class="sheet-drag-handle"></div>
        <div class="sheet-header">
            <h3 id="modalTitle">Nova Transação</h3>
            <button class="sheet-close-btn" onclick="closeQuickAddModal()"><i class="fas fa-times"></i></button>
        </div>

        <form id="quickAddForm" onsubmit="handleQuickAddSubmit(event)">
            <div class="type-toggle-group">
                <button type="button" class="type-toggle-btn active expense" id="toggleExpense" onclick="setQuickType('expense')">
                    <i class="fas fa-arrow-down"></i> Despesa
                </button>
                <button type="button" class="type-toggle-btn income" id="toggleIncome" onclick="setQuickType('income')">
                    <i class="fas fa-arrow-up"></i> Receita
                </button>
            </div>

            <div class="sheet-form-group">
                <label>Descrição</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-pencil-alt"></i>
                    <input type="text" id="quickDesc" class="sheet-input" placeholder="Ex: Supermercado, Salário..." required>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Valor (R$)</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-dollar-sign"></i>
                    <input type="number" step="0.01" min="0.01" id="quickAmount" class="sheet-input" placeholder="0,00" required>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Categoria</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-tags"></i>
                    <select id="quickCategory" class="sheet-input" required>
                        <option value="">Selecione a categoria...</option>
                    </select>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Data</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-calendar"></i>
                    <input type="date" id="quickDate" class="sheet-input" required>
                </div>
            </div>

            <button type="submit" class="sheet-submit-btn" id="quickSubmitBtn">Salvar Transação</button>
        </form>
    </div>
</div>

<!-- BOTTOM NAV (COM BOTÃO CENTRAL +) -->
<nav class="bottom-nav">
    <a href="dashboard.html" class="active"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>
    <a href="transactions.html"><i class="fas fa-exchange-alt"></i><span>Transações</span></a>
    <a href="bills.html"><i class="fas fa-file-invoice-dollar"></i><span>Contas</span></a>
    <div class="nav-center">
        <button type="button" class="nav-add-btn" onclick="openQuickAddModal('expense')" aria-label="Nova Transação" title="Nova Transação">
            <i class="fas fa-plus"></i>
        </button>
    </div>
    <a href="investments.html"><i class="fas fa-chart-line"></i><span>Investimentos</span></a>
    <a href="goals.html"><i class="fas fa-bullseye"></i><span>Metas</span></a>
    <a href="settings.html"><i class="fas fa-cog"></i><span>Configurações</span></a>
</nav>

<!-- TOAST -->
<div id="toast" class="toast hidden" role="alert"></div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>
<script src="../../js/core.js"></script>
<script src="../../js/security.js"></script>
<script src="../../js/sync.js"></script>
<script src="../../js/financial-tools.js"></script>
<script src="../../js/notifications.js"></script>
<script src="../../js/sw-register.js"></script>
<script src="../../js/mobile/dashboard.js"></script>

</body>
</html>
