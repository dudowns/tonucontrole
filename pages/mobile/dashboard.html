    <style>
        .skip-link {
            position: absolute; top: -100%; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: linear-gradient(135deg, #3730A3 0%, #4338CA 52%, #4F46E5 100%); color: #fff; border-radius: 12px;
            z-index: 999999; font-weight: 600; text-decoration: none;
        }
        .skip-link:focus { top: 16px; }
        .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: #4338CA;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        (function () {
            if (localStorage.getItem('tonu_bottom_nav_labels') === 'false') {
                document.documentElement.classList.add('nav-icons-only');
            }
            var t = localStorage.getItem('tonu_theme') || 'light';
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.documentElement.classList.add('dark-theme');
            }
            try {
                var raw = sessionStorage.getItem('tonu_just_logged_in');
                var hasRecentLogin = false;
                if (raw) {
                    var parsed = JSON.parse(raw);
                    if (parsed && (!parsed.ts || (Date.now() - Number(parsed.ts)) < 120000)) {
                        hasRecentLogin = true;
                    }
                }
                var search = window.location.search || '';
                var hash = window.location.hash || '';
                var hasOAuth = search.indexOf('code=') !== -1 || search.indexOf('post_login=1') !== -1 || hash.indexOf('access_token=') !== -1;
                if (hasRecentLogin || hasOAuth) {
                    document.documentElement.classList.add('tonu-entering-dashboard');
                }
            } catch (_) {}
        })();
    </script>
</head>

<!-- BOTTOM SHEET MODAL (ADICIONAR TRANSAÇÃO RÁPIDA) -->
<div class="mobile-modal-overlay" id="quickAddModal" onclick="closeQuickAddModal(event)">
    <div class="mobile-modal-sheet" onclick="event.stopPropagation()">
        <div class="sheet-drag-handle"></div>
        <div class="sheet-header">
            <h3 id="modalTitle">Nova Transação</h3>
            <button class="sheet-close-btn" onclick="closeQuickAddModal()"><i class="fas fa-times"></i></button>
        </div>

        <form id="quickAddForm" onsubmit="handleQuickAddSubmit(event)">
            <div class="type-toggle-group">
                <button type="button" class="type-toggle-btn active expense" id="toggleExpense" onclick="setQuickType('expense')">
                    <i class="fas fa-arrow-down"></i> Despesa
                </button>
                <button type="button" class="type-toggle-btn income" id="toggleIncome" onclick="setQuickType('income')">
                    <i class="fas fa-arrow-up"></i> Receita
                </button>
            </div>

            <div class="sheet-form-group">
                <label>Descrição</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-pencil-alt"></i>
                    <input type="text" id="quickDesc" class="sheet-input" placeholder="Ex: Supermercado, Salário..." required>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Valor (R$)</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-dollar-sign"></i>
                    <input type="number" step="0.01" min="0.01" id="quickAmount" class="sheet-input" placeholder="0,00" required>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Categoria</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-tags"></i>
                    <select id="quickCategory" class="sheet-input" required>
                        <option value="">Selecione a categoria...</option>
                    </select>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Data</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-calendar"></i>
                    <input type="date" id="quickDate" class="sheet-input" required>
                </div>
            </div>

            <button type="submit" class="sheet-submit-btn" id="quickSubmitBtn">Salvar Transação</button>
        </form>
    </div>
</div>
