<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TonuControle">
    <link rel="manifest" href="../../manifest.json">
    <link rel="apple-touch-icon" href="../../icons/icon-192x192.png">
    <title>TonuControle - Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/dark-theme.css">
    <link rel="stylesheet" href="../../css/mobile.css">
    <link rel="stylesheet" href="../../css/notifications.css">
    <link rel="stylesheet" href="../../css/sync-status.css">
    <style>
        body { padding-bottom: 72px; }
        .skip-link {
            position: absolute; top: -100%; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: #6C5CE7; color: #fff; border-radius: 8px;
            z-index: 999999; font-weight: 600; text-decoration: none;
        }
        .skip-link:focus { top: 16px; }
        .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: #6C5CE7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

<!-- TOPBAR -->
<header class="mobile-topbar">
    <div class="topbar-header">
        <div class="topbar-left">
            <div class="app-icon"><img src="../../icons/logo.png" alt="TonuControle"></div>
            <h1>Tonu<span>Controle</span></h1>
        </div>
        <div class="topbar-actions">
            <button onclick="toggleTheme()" title="Alternar tema">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            <button id="notifBellBtn" onclick="window.toggleNotificationDropdown(event)" title="Notificações">
                <i class="fas fa-bell"></i>
                <span class="notif-badge hidden" id="notifBadgeCount">0</span>
            </button>
        </div>
    </div>
    <div class="greeting" id="greetingText">Olá, Usuário 👋</div>
</header>

<!-- CONTEÚDO -->
<main class="mobile-content" id="main-content">
    <div id="summaryContainer"></div>
    <div class="mobile-section-title">
        <span>📋 Últimas Transações</span>
        <a href="transactions.html">Ver todas →</a>
    </div>
    <div id="mobileTransactions">
        <div style="text-align:center;padding:20px;">
            <span class="spinner"></span>
            <p style="margin-top:8px;font-size:13px;color:#94a3b8;">Carregando...</p>
        </div>
    </div>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <a href="dashboard.html" class="active"><i class="fas fa-home"></i><span>Início</span></a>
    <a href="transactions.html"><i class="fas fa-exchange-alt"></i><span>Transações</span></a>
    <div class="nav-center">
        <button class="btn-add" onclick="openAddTransaction()" aria-label="Nova transação">
            <i class="fas fa-plus"></i>
        </button>
    </div>
    <a href="bills.html"><i class="fas fa-file-invoice-dollar"></i><span>Contas</span></a>
    <a href="settings.html"><i class="fas fa-cog"></i><span>Config.</span></a>
</nav>

<!-- TOAST -->
<div id="toast" class="toast hidden" role="alert"></div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>
<script src="../../js/core.js"></script>
<script src="../../js/security.js"></script>
<script src="../../js/sync.js"></script>
<script src="../../js/notifications.js"></script>
<script src="../../js/sw-register.js"></script>
<script src="../../js/mobile/dashboard.js"></script>

</body>
</html>
