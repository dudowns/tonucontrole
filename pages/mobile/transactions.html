<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <link rel="manifest" href="../../manifest.json">
    <link rel="apple-touch-icon" href="../../icons/icon-192x192.png">
    <title>Transações - Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/dark-theme.css">
    <link rel="stylesheet" href="../../css/mobile.css">
    <link rel="stylesheet" href="../../css/notifications.css">
    <style>
        body { padding-bottom: 72px; background: var(--color-bg, #f0f2f5); }
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 0 0 10px 0;
            overflow-x: auto;
        }
        .filter-bar select {
            flex: 1;
            min-height: 36px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--color-border, #e2e8f0);
            background: var(--color-surface, #ffffff);
            color: var(--color-text, #1e293b);
            min-width: 80px;
        }
        .filter-bar .search-box {
            flex: 2;
            position: relative;
        }
        .filter-bar .search-box input {
            width: 100%;
            padding: 6px 10px 6px 32px;
            border-radius: 8px;
            border: 1px solid var(--color-border, #e2e8f0);
            background: var(--color-surface, #ffffff);
            color: var(--color-text, #1e293b);
            font-size: 12px;
            min-height: 36px;
        }
        .filter-bar .search-box i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted, #94a3b8);
            font-size: 12px;
        }
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
    </style>
</head>
<body>

<header class="mobile-topbar">
    <div class="topbar-header">
        <div class="topbar-left">
            <div class="app-icon"><img src="../../icons/logo.png" alt="TonuControle"></div>
            <h1>Tonu<span>Controle</span></h1>
        </div>
        <div class="topbar-actions">
            <button onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
            <button onclick="window.history.back()" title="Voltar"><i class="fas fa-arrow-left"></i></button>
        </div>
    </div>
    <div class="greeting">📋 Transações</div>
</header>

<main class="mobile-content">
    <!-- SELETOR DE MÊS -->
    <div style="display:flex; align-items:center; justify-content:space-between; background:var(--color-surface,#fff); padding:8px 14px; border-radius:12px; margin-bottom:10px; border:1px solid var(--color-border,#e2e8f0);">
        <button onclick="changeMonth(-1)" aria-label="Mês anterior" style="background:none; border:none; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--color-text,#1e293b); cursor:pointer; font-size:14px;">
            <i class="fas fa-chevron-left"></i>
        </button>
        <span id="selectedMonth" style="font-weight:600; font-size:14px; color:var(--color-text,#1e293b);">Setembro 2026</span>
        <button onclick="changeMonth(1)" aria-label="Próximo mês" style="background:none; border:none; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--color-text,#1e293b); cursor:pointer; font-size:14px;">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <div class="filter-bar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar..." oninput="filterTransactions()">
        </div>
        <select id="filterType" onchange="filterTransactions()">
            <option value="all">Todos</option>
            <option value="income">Receitas</option>
            <option value="expense">Despesas</option>
        </select>
    </div>
    <div id="transactionList" class="transaction-list">
        <div style="text-align:center;padding:20px;">
            <span class="spinner"></span>
            <p style="margin-top:8px;font-size:13px;color:#94a3b8;">Carregando...</p>
        </div>
    </div>
</main>

<!-- BOTTOM SHEET MODAL (ADICIONAR TRANSAÇÃO) -->
<div class="mobile-modal-overlay" id="quickAddModal" onclick="closeQuickAddModal(event)">
    <div class="mobile-modal-sheet" onclick="event.stopPropagation()">
        <div class="sheet-drag-handle"></div>
        <div class="sheet-header">
            <h3 id="modalTitle">Nova Transação</h3>
            <button class="sheet-close-btn" onclick="closeQuickAddModal()"><i class="fas fa-times"></i></button>
        </div>

        <form id="quickAddForm" onsubmit="handleQuickAddSubmit(event)">
            <div class="type-toggle-group">
                <button type="button" class="type-toggle-btn active expense" id="toggleExpense" onclick="setQuickType('expense')">
                    <i class="fas fa-arrow-down"></i> Despesa
                </button>
                <button type="button" class="type-toggle-btn income" id="toggleIncome" onclick="setQuickType('income')">
                    <i class="fas fa-arrow-up"></i> Receita
                </button>
            </div>

            <div class="sheet-form-group">
                <label>Descrição</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-pencil-alt"></i>
                    <input type="text" id="quickDesc" class="sheet-input" placeholder="Ex: Mercado, Combustível, Salário..." required>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Valor (R$)</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-dollar-sign"></i>
                    <input type="number" step="0.01" min="0.01" id="quickAmount" class="sheet-input" placeholder="0,00" required>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Categoria</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-tags"></i>
                    <select id="quickCategory" class="sheet-input" required>
                        <option value="">Selecione a categoria...</option>
                    </select>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Data</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-calendar"></i>
                    <input type="date" id="quickDate" class="sheet-input" required>
                </div>
            </div>

            <button type="submit" class="sheet-submit-btn" id="quickSubmitBtn">Salvar Transação</button>
        </form>
    </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <a href="dashboard.html"><i class="fas fa-home"></i><span>Início</span></a>
    <a href="transactions.html" class="active"><i class="fas fa-exchange-alt"></i><span>Transações</span></a>
    <div class="nav-center">
        <button class="btn-add" onclick="openAddTransaction()"><i class="fas fa-plus"></i></button>
    </div>
    <a href="bills.html"><i class="fas fa-file-invoice-dollar"></i><span>Contas</span></a>
    <a href="settings.html"><i class="fas fa-cog"></i><span>Config.</span></a>
</nav>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>
<script src="../../js/core.js"></script>
<script src="../../js/sync.js"></script>
<script src="../../js/notifications.js"></script>
<script src="../../js/sw-register.js"></script>
<script>
// ============================================
// MOBILE TRANSACTIONS
// ============================================
let currentUser = null;
let allTransactions = [];
let categories = [];
let filteredTransactions = [];
let currentQuickType = "expense";
let currentMonthOffset = 0;

const MONTH_NAMES = [
    'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
    'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
];

function getSelectedMonthDate() {
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + currentMonthOffset);
    return d;
}

function updateMonthDisplay() {
    const d = getSelectedMonthDate();
    const el = document.getElementById('selectedMonth');
    if (el) {
        el.textContent = `${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
    }
}

function changeMonth(delta) {
    currentMonthOffset += Number(delta) || 0;
    updateMonthDisplay();
    loadTransactions();
}

document.addEventListener("DOMContentLoaded", async () => {
    const savedTheme = localStorage.getItem("tonu_theme") || "light";
    if (savedTheme === "dark") {
        document.body.classList.add("dark-theme");
        document.documentElement.setAttribute("data-theme", "dark");
        document.querySelector("#themeIcon")?.classList.replace("fa-moon", "fa-sun");
    }

    updateMonthDisplay();

    try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = "../../index.html"; return; }
        currentUser = user;

        await loadCategories();
        await loadTransactions();

        const params = new URLSearchParams(window.location.search);
        if (params.get('action') === 'new') {
            openAddTransaction();
        }
    } catch (e) {
        console.error("Erro:", e);
        window.location.href = "../../index.html";
    }
});

async function loadCategories() {
    try {
        const { data, error } = await supabaseClient
            .from("categories")
            .select("*")
            .eq("user_id", currentUser.id);
        if (error) throw error;
        categories = data || [];
    } catch (e) {
        categories = [];
    }
}

async function loadTransactions() {
    try {
        const selDate = getSelectedMonthDate();
        const year = selDate.getFullYear();
        const month = String(selDate.getMonth() + 1).padStart(2, "0");
        const firstDay = `${year}-${month}-01`;
        const lastDay = `${year}-${month}-${new Date(year, selDate.getMonth() + 1, 0).getDate()}`;

        let txs = [];
        if (supabaseClient) {
            const { data, error } = await supabaseClient
                .from("transactions")
                .select("*")
                .eq("user_id", currentUser.id)
                .gte("date", firstDay)
                .lte("date", lastDay)
                .order("date", { ascending: false });

            if (!error && data) {
                txs = data;
            }
        }

        allTransactions = txs;
        filterTransactions();
    } catch (error) {
        console.error("Erro ao carregar:", error);
    }
}

function renderTransactions() {
    const container = document.getElementById("transactionList");

    if (filteredTransactions.length === 0) {
        container.innerHTML = `
            <div class="mobile-empty">
                <span class="empty-icon">📭</span>
                <h3>Nenhuma transação</h3>
                <p>Toque no botão + para adicionar</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filteredTransactions.map(t => {
        const isIncome = t.type === "income";
        const cat = categories.find(c => c.id === t.category_id);
        const color = cat?.color || (isIncome ? "#00B894" : "#FF7675");
        const icon = cat?.icon || (isIncome ? "fa-money-bill-wave" : "fa-tag");

        let badge = "";
        if (t.is_bill) badge += `<span style="font-size:9px; background:#fff3cd; color:#856404; padding:2px 6px; border-radius:4px; margin-left:4px;">Conta</span>`;
        if (t.is_bill && !t.paid) badge += `<span style="font-size:9px; background:#f8d7da; color:#721c24; padding:2px 6px; border-radius:4px; margin-left:4px;">Pendente</span>`;

        return `
            <div class="mobile-transaction" style="display:flex; justify-content:space-between; align-items:center;">
                <div class="tx-left" style="display:flex; align-items:center; gap:10px; flex:1;">
                    <div class="tx-icon" style="background:${color}; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-size:13px;">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div class="tx-info">
                        <strong>${t.description} ${badge}</strong>
                        <small style="display:block; color:#94a3b8; font-size:11px;">${formatDate(t.date)} • ${cat?.name || 'Geral'}</small>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="tx-amount ${isIncome ? 'income' : 'expense'}" style="font-weight:700; font-size:13px; color:${isIncome ? '#00B894' : '#FF7675'}">
                        ${isIncome ? '+' : '-'} ${formatCurrency(t.amount)}
                    </span>
                    <button onclick="deleteTransaction('${t.id}')" style="border:none; background:transparent; color:#cbd5e1; padding:4px; font-size:13px; cursor:pointer;" title="Excluir">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `;
    }).join("");
}

function filterTransactions() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const type = document.getElementById("filterType").value;

    filteredTransactions = allTransactions.filter(t => {
        const matchSearch = t.description.toLowerCase().includes(search);
        const matchType = type === "all" || t.type === type;
        return matchSearch && matchType;
    });

    renderTransactions();
}

function openAddTransaction() {
    setQuickType("expense");
    const dateInput = document.getElementById("quickDate");
    if (dateInput) {
        const selDate = getSelectedMonthDate();
        const now = new Date();
        if (selDate.getFullYear() === now.getFullYear() && selDate.getMonth() === now.getMonth()) {
            dateInput.value = now.toISOString().split("T")[0];
        } else {
            const y = selDate.getFullYear();
            const m = String(selDate.getMonth() + 1).padStart(2, "0");
            dateInput.value = `${y}-${m}-01`;
        }
    }
    populateCategoryOptions();
    document.getElementById("quickAddModal")?.classList.add("active");
}

function closeQuickAddModal(e) {
    if (e && e.target !== e.currentTarget && e.target.classList && !e.target.classList.contains("mobile-modal-overlay")) return;
    document.getElementById("quickAddModal")?.classList.remove("active");
}

function setQuickType(type) {
    currentQuickType = type;
    const expBtn = document.getElementById("toggleExpense");
    const incBtn = document.getElementById("toggleIncome");
    const title = document.getElementById("modalTitle");

    if (type === "expense") {
        expBtn?.classList.add("active");
        incBtn?.classList.remove("active");
        if (title) title.textContent = "Nova Despesa";
    } else {
        incBtn?.classList.add("active");
        expBtn?.classList.remove("active");
        if (title) title.textContent = "Nova Receita";
    }
    populateCategoryOptions();
}

function populateCategoryOptions() {
    const select = document.getElementById("quickCategory");
    if (!select) return;
    const filtered = categories.filter(c => !c.type || c.type === currentQuickType);
    select.innerHTML = '<option value="">Selecione a categoria...</option>' +
        (filtered.length > 0 ? filtered : categories).map(c => `<option value="${c.id}">${c.name}</option>`).join("");
}

async function handleQuickAddSubmit(event) {
    event.preventDefault();
    const btn = document.getElementById("quickSubmitBtn");
    const desc = document.getElementById("quickDesc").value.trim();
    const amount = parseFloat(document.getElementById("quickAmount").value);
    const category_id = document.getElementById("quickCategory").value;
    const date = document.getElementById("quickDate").value;

    if (!desc || isNaN(amount) || amount <= 0 || !category_id || !date) {
        showToast("Preencha todos os campos corretamente!", "error");
        return;
    }

    btn.disabled = true;
    btn.textContent = "Salvando...";

    try {
        const { error } = await supabaseClient.from("transactions").insert([{
            user_id: currentUser.id,
            description: desc,
            amount: amount,
            type: currentQuickType,
            category_id: category_id,
            date: date
        }]);

        if (error) throw error;

        showToast("Transação adicionada com sucesso! 🎉", "success");
        closeQuickAddModal();
        document.getElementById("quickAddForm").reset();
        await loadTransactions();
    } catch (err) {
        console.error("Erro ao salvar:", err);
        showToast("Erro ao salvar: " + (err.message || "Tente novamente"), "error");
    } finally {
        btn.disabled = false;
        btn.textContent = "Salvar Transação";
    }
}

async function deleteTransaction(id) {
    if (!confirm("Deseja realmente excluir esta transação?")) return;
    try {
        const { error } = await supabaseClient.from("transactions").delete().eq("id", id).eq("user_id", currentUser.id);
        if (error) throw error;
        showToast("Transação excluída!", "success");
        await loadTransactions();
    } catch (err) {
        console.error("Erro ao excluir:", err);
        showToast("Erro ao excluir transação.", "error");
    }
}

function showToast(message, type) {
    type = type || "info";
    const toast = document.getElementById("toast");
    if (!toast) return;
    toast.textContent = message;
    toast.className = `toast ${type} show`;
    setTimeout(() => { toast.className = "toast hidden"; }, 3000);
}

function formatCurrency(value) {
    if (typeof window.formatCurrency === 'function' && window.formatCurrency !== formatCurrency) {
        return window.formatCurrency(value);
    }
    if (value === null || value === undefined || value === '') value = 0;
    if (typeof value === 'string') {
        const cleaned = value.replace(/[R$\s]/g, '');
        if (cleaned.includes(',') && cleaned.includes('.')) {
            value = cleaned.replace(/\./g, '').replace(',', '.');
        } else if (cleaned.includes(',')) {
            value = cleaned.replace(',', '.');
        }
        value = parseFloat(value);
    }
    const num = Number(value) || 0;
    try {
        const formatted = new Intl.NumberFormat("pt-BR", {
            style: "currency",
            currency: "BRL",
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(num);
        return formatted.replace(/\u00A0/g, ' ');
    } catch {
        const isNegative = num < 0;
        const parts = Math.abs(num).toFixed(2).split('.');
        const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        const res = 'R$ ' + intPart + ',' + parts[1];
        return isNegative ? '-' + res : res;
    }
}

function formatDate(date) {
    if (!date) return "--/--/----";
    const d = new Date(date);
    return d.toLocaleDateString("pt-BR");
}

function toggleTheme() {
    const isDark = document.body.classList.toggle("dark-theme");
    localStorage.setItem("tonu_theme", isDark ? "dark" : "light");
    const icon = document.querySelector("#themeIcon");
    if (icon) icon.className = isDark ? "fas fa-sun" : "fas fa-moon";
}
</script>

</body>
</html>
