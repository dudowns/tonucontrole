<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="../../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../../icons/icon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../icons/icon-72x72.png">
    <link rel="icon" type="image/png" sizes="128x128" href="../../icons/icon-128x128.png">
    <link rel="shortcut icon" href="../../icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../icons/icon-192x192.png">
    <title>Transações - Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/theme.css">
    <link rel="stylesheet" href="../../css/dark-theme.css">
    <link rel="stylesheet" href="../../css/mobile.css">
    <link rel="stylesheet" href="../../css/notifications.css">
    <style>
        body { background: var(--color-bg, #f0f2f5); }
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 0 0 10px 0;
            overflow-x: auto;
        }
        .filter-bar select {
            flex: 1;
            min-height: 36px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--color-border, #e2e8f0);
            background: var(--color-surface, #ffffff);
            color: var(--color-text, #1e293b);
            min-width: 80px;
        }
        .filter-bar .search-box {
            flex: 2;
            position: relative;
        }
        .filter-bar .search-box input {
            width: 100%;
            padding: 6px 10px 6px 32px;
            border-radius: 8px;
            border: 1px solid var(--color-border, #e2e8f0);
            background: var(--color-surface, #ffffff);
            color: var(--color-text, #1e293b);
            font-size: 12px;
            min-height: 36px;
        }
        .filter-bar .search-box i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted, #94a3b8);
            font-size: 12px;
        }
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
    </style>
</head>
<body>

<header class="mobile-topbar">
    <div class="topbar-header">
        <div class="topbar-left">
            <div class="app-icon"><img src="../../icons/logo.png" alt="TonuControle"></div>
            <h1>Tonu<span>Controle</span></h1>
        </div>
        <div class="topbar-actions">
            <button class="topbar-btn" onclick="window.history.back()" title="Voltar" aria-label="Voltar"><i class="fas fa-arrow-left"></i></button>
            <a href="settings.html" class="topbar-avatar-btn" title="Perfil" aria-label="Perfil">
                <div class="topbar-avatar-mini" id="topbarAvatar">U</div>
            </a>
            <button class="topbar-more-btn" onclick="toggleMobileMoreMenu(event)" title="Mais opções" aria-label="Mais opções">
                <i class="fas fa-ellipsis-h"></i>
            </button>
            <div class="mobile-more-dropdown hidden" id="mobileMoreMenuDropdown">
                <button type="button" class="more-menu-item" onclick="window.exportTransactionsCSV && window.exportTransactionsCSV(); closeMobileMoreMenu();">
                    <i class="fas fa-file-export"></i> <span>Exportar CSV</span>
                </button>
                <button type="button" class="more-menu-item" id="notifBellBtn" onclick="window.toggleNotificationDropdown(event); closeMobileMoreMenu();">
                    <i class="fas fa-bell"></i> <span>Notificações</span>
                    <span class="notif-badge hidden" id="notifBadgeCount">0</span>
                </button>
                <button type="button" class="more-menu-item" onclick="toggleTheme(); closeMobileMoreMenu();">
                    <i class="fas fa-moon" id="themeIcon"></i> <span>Alternar Tema</span>
                </button>
                <button type="button" class="more-menu-item" onclick="window.tonuSync && window.tonuSync.syncPendingData ? window.tonuSync.syncPendingData() : location.reload(); closeMobileMoreMenu();">
                    <i class="fas fa-sync-alt"></i> <span>Sincronizar</span>
                </button>
            </div>
        </div>
    </div>
    <div class="greeting">📋 Transações</div>
</header>

<main class="mobile-content">
    <!-- SELETOR DE MÊS COM BOTÃO DE NOVA TRANSAÇÃO -->
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        <div class="mobile-month-selector-bar" style="margin-bottom:0; flex:1;">
            <div class="month-selector">
                <button class="month-nav" onclick="changeMonth(-1)" aria-label="Mês anterior">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <span class="month-label" id="selectedMonth">Setembro 2026</span>
                <button class="month-nav" onclick="changeMonth(1)" aria-label="Próximo mês">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
        <button type="button" class="btn-primary" onclick="openAddTransaction()" style="height:48px; padding:0 16px; border-radius:16px; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; border:none; background:linear-gradient(135deg, #6C5CE7 0%, #8B5CF6 100%); color:#fff; cursor:pointer; box-shadow:0 3px 10px rgba(108,92,231,0.3); transition:all 0.18s; touch-action:manipulation;">
            <i class="fas fa-plus"></i> Nova
        </button>
    </div>

    <!-- HERO CARD RESUMO DO MÊS (PADRÃO DASHBOARD PREMIUM) -->
    <div class="mobile-hero-card" id="monthSummaryHero">
        <div class="hero-top">
            <span class="hero-label"><i class="fas fa-wallet"></i> Saldo Operacional do Mês</span>
            <span class="badge-mobile" style="background: rgba(255,255,255,0.2); color:#fff; font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:0.4px;">
                EXTRATO
            </span>
        </div>
        <div class="hero-value" id="sumBalance">R$ 0,00</div>
        <div class="hero-footer">
            <div class="hero-stat">
                <span class="hero-stat-label"><i class="fas fa-arrow-down" style="color: #6ee7b7;"></i> Entradas</span>
                <span class="hero-stat-val income" id="sumIncome">R$ 0,00</span>
            </div>
            <div class="hero-stat">
                <span class="hero-stat-label"><i class="fas fa-arrow-up" style="color: #fca5a5;"></i> Saídas</span>
                <span class="hero-stat-val expense" id="sumExpense">R$ 0,00</span>
            </div>
        </div>
    </div>

    <!-- IOS SEGMENTED CONTROL (STATUS) -->
    <div class="ios-segmented-control" role="tablist" aria-label="Filtro de Status">
        <button type="button" class="ios-segment-button active" id="segBtnPaid" onclick="setStatusFilter('paid', this)">
            <i class="fas fa-check-circle" style="color:#00B894; font-size:11px;"></i> Pagas
        </button>
        <button type="button" class="ios-segment-button" id="segBtnAll" onclick="setStatusFilter('all', this)">
            Todas
        </button>
        <button type="button" class="ios-segment-button" id="segBtnPending" onclick="setStatusFilter('pending', this)">
            <i class="fas fa-clock" style="color:#f59e0b; font-size:11px;"></i> Pendentes
        </button>
    </div>

    <!-- IOS SEARCH BAR -->
    <div class="ios-search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Buscar transações..." oninput="handleSearchInput(this.value)">
        <button type="button" class="ios-search-clear" id="searchClearBtn" onclick="clearSearch()" style="display:none;" aria-label="Limpar busca">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- FILTROS DE TIPO E CATEGORIAS (HORIZONTAL CHIPS) -->
    <div class="ios-filter-scroll" id="typeFilterChips">
        <button type="button" class="ios-chip active" data-type="all" onclick="setTypeFilter('all', this)">
            Todos os Tipos
        </button>
        <button type="button" class="ios-chip" data-type="expense" onclick="setTypeFilter('expense', this)">
            <i class="fas fa-arrow-down" style="color:#FF7675;"></i> Despesas
        </button>
        <button type="button" class="ios-chip" data-type="income" onclick="setTypeFilter('income', this)">
            <i class="fas fa-arrow-up" style="color:#00B894;"></i> Receitas
        </button>
        <button type="button" class="ios-chip" data-type="anticipation" onclick="setTypeFilter('anticipation', this)">
            <i class="fas fa-bolt" style="color:#0284c7;"></i> Antecipações
        </button>
        <div style="width:1px; height:24px; background:var(--color-border, #e2e8f0); margin:4px 2px; flex-shrink:0;"></div>
        <select id="filterCategory" onchange="filterTransactions()" class="ios-chip" style="font-weight:600; cursor:pointer; outline:none; -webkit-appearance:menulist;" title="Filtrar por categoria">
            <option value="all">🏷️ Todas as categorias</option>
        </select>
    </div>

    <!-- SELECTS OCULTOS PARA COMPATIBILIDADE DE TESTES E SCRIPTS -->
    <select id="filterStatus" onchange="filterTransactions()" style="display:none;" aria-hidden="true">
        <option value="paid" selected>Pagas</option>
        <option value="all">Todas</option>
        <option value="pending">Pendentes</option>
    </select>
    <select id="filterType" onchange="filterTransactions()" style="display:none;" aria-hidden="true">
        <option value="all" selected>Todos</option>
        <option value="income">Receitas</option>
        <option value="expense">Despesas</option>
        <option value="anticipation">⚡ Antecipações</option>
    </select>

    <div id="transactionList" class="transaction-list" style="margin-top: 4px;">
        <div style="text-align:center;padding:24px;">
            <span class="spinner"></span>
            <p style="margin-top:8px;font-size:13px;color:#94a3b8;">Carregando transações...</p>
        </div>
    </div>
</main>

<!-- BOTTOM SHEET MODAL (ADICIONAR TRANSAÇÃO) -->
<div class="mobile-modal-overlay" id="quickAddModal" onclick="closeQuickAddModal(event)">
    <div class="mobile-modal-sheet" onclick="event.stopPropagation()">
        <div class="sheet-drag-handle"></div>
        <div class="sheet-header">
            <h3 id="modalTitle">Nova Transação</h3>
            <button class="sheet-close-btn" onclick="closeQuickAddModal()"><i class="fas fa-times"></i></button>
        </div>

        <form id="quickAddForm" onsubmit="handleQuickAddSubmit(event)">
            <div class="type-toggle-group">
                <button type="button" class="type-toggle-btn active expense" id="toggleExpense" onclick="setQuickType('expense')">
                    <i class="fas fa-arrow-down"></i> Despesa
                </button>
                <button type="button" class="type-toggle-btn income" id="toggleIncome" onclick="setQuickType('income')">
                    <i class="fas fa-arrow-up"></i> Receita
                </button>
            </div>

            <div class="sheet-form-group">
                <label>Descrição</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-pencil-alt"></i>
                    <input type="text" id="quickDesc" class="sheet-input" placeholder="Ex: Mercado, Combustível, Salário..." required>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Valor (R$)</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-dollar-sign"></i>
                    <input type="number" step="0.01" min="0.01" id="quickAmount" class="sheet-input" placeholder="0,00" required>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Categoria</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-tags"></i>
                    <select id="quickCategory" class="sheet-input" required>
                        <option value="">Selecione a categoria...</option>
                    </select>
                </div>
            </div>

            <div class="sheet-form-group">
                <label>Data</label>
                <div class="sheet-input-wrapper">
                    <i class="fas fa-calendar"></i>
                    <input type="date" id="quickDate" class="sheet-input" required>
                </div>
            </div>

            <button type="submit" class="sheet-submit-btn" id="quickSubmitBtn">Salvar Transação</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js"></script>
<script src="../../js/core.js"></script>
<script src="../../js/sync.js"></script>
<script src="../../js/financial-tools.js"></script>
<script src="../../js/notifications.js"></script>
<script src="../../js/sw-register.js"></script>
<script>
// ============================================
// MOBILE TRANSACTIONS
// ============================================
let currentUser = null;
let allTransactions = [];
let categories = [];
let filteredTransactions = [];
let currentQuickType = "expense";
let currentMonthOffset = 0;

const MONTH_NAMES = [
    'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
    'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
];

function getSelectedMonthDate() {
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + currentMonthOffset);
    return d;
}

function updateMonthDisplay() {
    const d = getSelectedMonthDate();
    const el = document.getElementById('selectedMonth');
    if (el) {
        el.textContent = `${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
    }
}

function changeMonth(delta) {
    currentMonthOffset += Number(delta) || 0;
    updateMonthDisplay();
    loadTransactions();
}

document.addEventListener("DOMContentLoaded", async () => {
    const savedTheme = localStorage.getItem("tonu_theme") || "light";
    if (savedTheme === "dark") {
        document.body.classList.add("dark-theme");
        document.documentElement.setAttribute("data-theme", "dark");
        document.querySelector("#themeIcon")?.classList.replace("fa-moon", "fa-sun");
    }

    updateMonthDisplay();

    try {
        let user = null;
        if (window.getAuthenticatedUser) {
            user = await window.getAuthenticatedUser();
        } else if (window.supabaseOffline) {
            user = await window.supabaseOffline.isAuthenticated();
        }
        if (!user && window.supabaseClient && window.supabaseClient.auth) {
            try {
                const { data: sessData } = await supabaseClient.auth.getSession();
                user = sessData?.session?.user;
                if (!user) {
                    const { data: userData } = await supabaseClient.auth.getUser();
                    user = userData?.user;
                }
            } catch (_) {}
        }
        if (!user) {
            try {
                const s = sessionStorage.getItem("tonu_user");
                if (s) { const p = JSON.parse(s); user = p.user || p; }
            } catch (_) {}
        }
        if (!user) {
            try {
                const off = localStorage.getItem("tonu_offline_session");
                if (off) { const p = JSON.parse(off); user = p.user || p; }
            } catch (_) {}
        }
        if (!user) { window.location.href = "../../index.html"; return; }
        currentUser = user;

        await loadCategories();
        await loadTransactions();

        const params = new URLSearchParams(window.location.search);
        if (params.get('action') === 'new') {
            openAddTransaction();
        }
    } catch (e) {
        console.error("Erro auth mobile transações:", e);
        window.location.href = "../../index.html";
    }
});

async function loadCategories() {
    try {
        let loaded = null;
        try {
            const { data, error } = await supabaseClient
                .from("categories")
                .select("*")
                .or(`user_id.eq.${currentUser.id},is_default.eq.true,user_id.is.null`)
                .order("name");
            if (!error && data && data.length > 0) loaded = data;
        } catch (_) {
            const { data, error } = await supabaseClient
                .from("categories")
                .select("*")
                .eq("user_id", currentUser.id);
            if (!error && data && data.length > 0) loaded = data;
        }

        if (loaded && loaded.length > 0) {
            categories = loaded;
        } else {
            categories = [
                { id: 'cat_contas', name: '⚡ Contas Básicas', type: 'expense', icon: 'fa-bolt', color: '#0984E3' },
                { id: 'cat_lazer', name: '🎮 Lazer', type: 'expense', icon: 'fa-gamepad', color: '#A29BFE' },
                { id: 'cat_saude', name: '❤️ Saúde', type: 'expense', icon: 'fa-heartbeat', color: '#FF6B6B' },
                { id: 'cat_educacao', name: '📚 Educação', type: 'expense', icon: 'fa-book', color: '#0984E3' },
                { id: 'cat_emprestimos', name: '🤝 Empréstimos', type: 'expense', icon: 'fa-hand-holding-usd', color: '#D63031' },
                { id: 'cat_cartao', name: '💳 Cartão de Crédito', type: 'expense', icon: 'fa-credit-card', color: '#E17055' },
                { id: 'cat_moradia', name: '🏠 Moradia', type: 'expense', icon: 'fa-home', color: '#E17055' },
                { id: 'cat_comunicacao', name: '📡 Comunicação', type: 'expense', icon: 'fa-wifi', color: '#636E72' },
                { id: 'cat_alimentacao', name: '🍔 Alimentação', type: 'expense', icon: 'fa-utensils', color: '#FF6B6B' },
                { id: 'cat_transporte', name: '🚗 Transporte', type: 'expense', icon: 'fa-car', color: '#FDCB6E' },
                { id: 'cat_salario', name: '💰 Salário', type: 'income', icon: 'fa-money-bill-wave', color: '#00B894' },
                { id: 'cat_investimentos', name: '💼 Investimentos', type: 'income', icon: 'fa-chart-line', color: '#00CEC9' },
                { id: 'cat_bico', name: '🛵 Bico / Extra', type: 'income', icon: 'fa-gift', color: '#00B894' },
                { id: 'cat_outros', name: '📦 Outros', type: 'expense', icon: 'fa-tag', color: '#B2BEC3' }
            ];
        }
        populateCategoryFilterOptions();
    } catch (e) {
        categories = [];
        populateCategoryFilterOptions();
    }
}

function populateCategoryFilterOptions() {
    const sel = document.getElementById("filterCategory");
    if (!sel) return;
    const currentVal = sel.value;
    sel.innerHTML = '<option value="all">Todas as categorias</option>' +
        categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
    if (categories.some(c => c.id === currentVal)) {
        sel.value = currentVal;
    } else {
        sel.value = "all";
    }
}

async function loadTransactions() {
    try {
        const selDate = getSelectedMonthDate();
        const year = selDate.getFullYear();
        const month = String(selDate.getMonth() + 1).padStart(2, "0");
        const ym = `${year}-${month}`;

        let txs = [];
        let fetchedOnline = false;
        if (navigator.onLine && supabaseClient && currentUser) {
            try {
                const { data, error } = await supabaseClient
                    .from("transactions")
                    .select("*")
                    .eq("user_id", currentUser.id)
                    .order("date", { ascending: false });

                if (!error && data) {
                    txs = data;
                    fetchedOnline = true;
                    if (window.tonuSync) {
                        await window.tonuSync.setCachedTransactions(currentUser.id, txs);
                    }
                }
            } catch (netErr) {
                console.warn("Falha online ao carregar transações:", netErr);
            }
        }

        if (!fetchedOnline && window.tonuSync) {
            const cached = await window.tonuSync.getCachedTransactions(currentUser?.id);
            if (cached && cached.length > 0) {
                txs = cached;
            }
        }

        if (window.TonuDeduplicate) {
            txs = window.TonuDeduplicate.deduplicate(txs, {
                autoCleanRemote: true,
                userId: currentUser?.id
            }).cleanList;
        }

        // Normalização de data de pagamento vs vencimento:
        // Se a conta ou transação foi paga e tem paid_date, date deve ser a data real do clique/pagamento
        txs.forEach(t => {
            if (t.paid && t.paid_date) {
                if (!t.due_date && t.date && t.date !== t.paid_date) {
                    t.due_date = t.date;
                }
                t.date = t.paid_date;
            }
        });

        // Filtrar pelo mês selecionado
        allTransactions = txs.filter(t => {
            const tDate = t.date || '';
            return tDate.startsWith(ym);
        });

        allTransactions.sort((a, b) => {
            const dateA = a.date || '';
            const dateB = b.date || '';
            if (dateA !== dateB) return dateB.localeCompare(dateA);
            return (b.created_at || '').localeCompare(a.created_at || '');
        });

        filterTransactions();
    } catch (error) {
        console.error("Erro ao carregar:", error);
        const container = document.getElementById("transactionList");
        if (container) {
            container.innerHTML = `
                <div class="mobile-empty-friendly">
                    <div class="empty-icon-box"><i class="fas fa-exclamation-circle"></i></div>
                    <h3>Não foi possível carregar</h3>
                    <p>Houve uma falha ao listar as transações. Toque abaixo para tentar novamente.</p>
                    <button type="button" class="btn-empty-action" onclick="loadTransactions()">
                        <i class="fas fa-redo"></i> Tentar Novamente
                    </button>
                </div>
            `;
        }
    }
}

function updateSummaryStrip(txs) {
    let inc = 0;
    let exp = 0;
    (txs || []).forEach(t => {
        const val = Math.abs(Number(t.amount) || 0);
        if (t.type === 'income') inc += val;
        else if (t.type === 'expense') exp += val;
    });
    const bal = inc - exp;
    const elInc = document.getElementById('sumIncome');
    const elExp = document.getElementById('sumExpense');
    const elBal = document.getElementById('sumBalance');
    if (elInc) elInc.textContent = formatCurrency(inc);
    if (elExp) elExp.textContent = formatCurrency(exp);
    if (elBal) {
        elBal.textContent = formatCurrency(bal);
        elBal.className = `ios-flow-val ${bal >= 0 ? 'income' : 'expense'}`;
    }
}

function handleSearchInput(val) {
    const clearBtn = document.getElementById("searchClearBtn");
    if (clearBtn) {
        clearBtn.style.display = val && val.trim().length > 0 ? "flex" : "none";
    }
    filterTransactions();
}

function clearSearch() {
    const input = document.getElementById("searchInput");
    if (input) {
        input.value = "";
    }
    const clearBtn = document.getElementById("searchClearBtn");
    if (clearBtn) clearBtn.style.display = "none";
    filterTransactions();
}

function setStatusFilter(status, btnEl) {
    const sel = document.getElementById("filterStatus");
    if (sel) sel.value = status;
    document.querySelectorAll(".ios-segment-button").forEach(b => b.classList.remove("active"));
    if (btnEl) btnEl.classList.add("active");
    filterTransactions();
}

function setTypeFilter(type, btnEl) {
    const sel = document.getElementById("filterType");
    if (sel) sel.value = type;
    document.querySelectorAll("#typeFilterChips .ios-chip").forEach(c => {
        if (c.tagName === 'BUTTON') c.classList.remove("active");
    });
    if (btnEl) btnEl.classList.add("active");
    filterTransactions();
}

function isTransactionPaid(t) {
    if (!t) return false;
    if (t.paid === false || t.paid === 'false' || t.paid === 0) return false;
    if (t.is_bill && (t.paid !== true && t.paid !== 'true' && t.paid !== 1)) return false;
    return true;
}

function getDateGroupHeader(dateStr) {
    if (!dateStr) return "Sem data";
    const parts = String(dateStr).split("T")[0].split("-");
    if (parts.length < 3) return dateStr;
    const y = Number(parts[0]);
    const m = Number(parts[1]);
    const d = Number(parts[2]);

    const today = new Date();
    if (today.getFullYear() === y && (today.getMonth() + 1) === m && today.getDate() === d) {
        return "Hoje";
    }

    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (yesterday.getFullYear() === y && (yesterday.getMonth() + 1) === m && yesterday.getDate() === d) {
        return "Ontem";
    }

    const monthNames = [
        'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
        'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];
    return `${String(d).padStart(2, '0')} de ${monthNames[m - 1]}`;
}

function colorTo15PercentAlpha(colorStr) {
    if (!colorStr) return 'rgba(108, 92, 231, 0.15)';
    if (colorStr.startsWith('#')) {
        let hex = colorStr.replace('#', '');
        if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
        const num = parseInt(hex, 16);
        const r = (num >> 16) & 255;
        const g = (num >> 8) & 255;
        const b = num & 255;
        return `rgba(${r}, ${g}, ${b}, 0.15)`;
    }
    if (colorStr.startsWith('rgb')) {
        return colorStr.replace('rgb(', 'rgba(').replace(')', ', 0.15)');
    }
    return 'rgba(108, 92, 231, 0.15)';
}

function renderTransactions() {
    const container = document.getElementById("transactionList");
    updateSummaryStrip(filteredTransactions);

    if (filteredTransactions.length === 0) {
        container.innerHTML = `
            <div class="mobile-empty-friendly">
                <div class="empty-icon-box"><i class="fas fa-receipt"></i></div>
                <h3>Tudo limpo por aqui!</h3>
                <p>Nenhuma transação encontrada. Toque no botão abaixo para adicionar sua primeira receita ou despesa.</p>
                <button type="button" class="btn-empty-action" onclick="openAddTransaction()">
                    <i class="fas fa-plus"></i> Adicionar Transação
                </button>
            </div>
        `;
        return;
    }

    // Agrupa transações por data (cada transação é um card individual)
    const groups = [];
    let currentGroup = null;

    filteredTransactions.forEach(t => {
        const effectiveDate = (t.paid && t.paid_date) ? t.paid_date : (t.date || '');
        const dateKey = effectiveDate ? effectiveDate.split('T')[0] : 'sem_data';

        if (!currentGroup || currentGroup.dateKey !== dateKey) {
            currentGroup = {
                dateKey: dateKey,
                dateHeader: getDateGroupHeader(dateKey),
                items: [],
                dayTotal: 0
            };
            groups.push(currentGroup);
        }
        currentGroup.items.push(t);
        const amt = Number(t.amount) || 0;
        currentGroup.dayTotal += (t.type === 'income' ? amt : -amt);
    });

    let html = '';
    let cardIndex = 0;

    groups.forEach(g => {
        const isDayPositive = g.dayTotal >= 0;
        const dayTotalFormatted = (isDayPositive ? '+ ' : '- ') + formatCurrency(Math.abs(g.dayTotal));

        html += `
            <div class="ios-section-header">
                <span>${g.dateHeader}</span>
                <span class="subtotal-pill" style="font-feature-settings:'tnum';">${dayTotalFormatted}</span>
            </div>
        `;

        g.items.forEach(t => {
            const isIncome = t.type === "income";
            let cat = null;
            if (t.category_id && categories && categories.length > 0) {
                cat = categories.find(c => c.id === t.category_id);
            }
            if (!cat && t.categories && typeof t.categories === 'object') {
                cat = t.categories;
            }
            const style = (typeof window !== 'undefined' && window.getBackendCategoryStyle)
                ? window.getBackendCategoryStyle(t.category || t.description, cat)
                : { color: cat?.color || (isIncome ? "#00B894" : "#FF6B6B"), icon: cat?.icon || (isIncome ? "fa-money-bill-wave" : "fa-tag") };

            const color = cat?.color || style.color || (isIncome ? "#00B894" : "#FF6B6B");
            const icon = cat?.icon || style.icon || (isIncome ? "fa-money-bill-wave" : "fa-tag");
            const squircleBg = typeof colorTo15PercentAlpha === 'function' ? colorTo15PercentAlpha(color) : 'rgba(108, 92, 231, 0.15)';
            const isPaid = isTransactionPaid(t);
            const instInfo = window.TonuInstallments ? window.TonuInstallments.getInstallmentInfo(t) : null;

            let badge = "";
            const isAnticipation = !!(t.is_anticipation || (t.description && String(t.description).toLowerCase().startsWith('antecipação:')));
            if (isAnticipation) {
                badge += `<span class="badge-mobile" style="background:#e0f2fe; color:#0284c7; border:1px solid #bae6fd;"><i class="fas fa-bolt"></i> Antecipação</span>`;
            }
            if (t.is_bill) {
                badge += `<span class="badge-mobile bill">Conta</span>`;
            }
            if (!isPaid) {
                badge += `<span class="badge-mobile pending">Pendente</span>`;
            }

            const rawDesc = window.TonuDeduplicate ? window.TonuDeduplicate.cleanDisplayDescription(t.description) : (t.description || 'Sem descrição');
            const safeDesc = typeof sanitizeString === 'function' ? sanitizeString(rawDesc) : rawDesc;
            const effectiveDate = (t.paid && t.paid_date) ? t.paid_date : (t.date || '');
            const dueNote = (t.due_date && t.due_date !== effectiveDate) ? ` • Venc: ${formatDate(t.due_date)}` : '';
            const delay = (Math.min(cardIndex++, 10) * 0.04).toFixed(2);
            html += `
                <div class="mobile-list-card clean-list-card stagger-card" style="animation-delay: ${delay}s;">
                    <div class="mobile-icon-squircle" style="background:${squircleBg}; color:${color};">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div class="clean-card-body">
                        <!-- Topo: Descrição à esquerda e Valor à direita -->
                        <div class="clean-card-top">
                            <span class="clean-card-title">${safeDesc}</span>
                            <div class="clean-card-amount-wrap">
                                <span class="clean-card-amount ${isIncome ? 'income' : 'expense'}">
                                    ${isIncome ? '+' : '-'} ${formatCurrency(t.amount)}
                                </span>
                                <button type="button" class="clean-card-delete-btn" onclick="event.stopPropagation(); deleteTransaction('${t.id}')" title="Excluir" aria-label="Excluir transação">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Meio: Tags e pílulas em linha própria com flex-wrap -->
                        <div class="clean-card-middle">
                            <span class="clean-tag category">${cat?.name || 'Geral'}</span>
                            ${badge}
                            ${instInfo && instInfo.badgeHtml ? instInfo.badgeHtml : ''}
                        </div>

                        <!-- Rodapé: Data da transação e Vencimento juntas -->
                        <div class="clean-card-bottom">
                            <span><i class="far fa-calendar-alt" style="margin-right:4px;"></i>${formatDate(effectiveDate)}</span>
                            ${(t.due_date && t.due_date !== effectiveDate) ? `<span><i class="far fa-clock" style="margin-right:4px;"></i>Venc: ${formatDate(t.due_date)}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        });
    });

    container.innerHTML = html;
}

function filterTransactions() {
    const search = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
    const type = document.getElementById("filterType")?.value || "all";
    const status = document.getElementById("filterStatus")?.value || "paid";
    const category = document.getElementById("filterCategory")?.value || "all";

    filteredTransactions = allTransactions.filter(t => {
        const desc = (t.description || "").toLowerCase();
        const matchSearch = !search || desc.includes(search);
        let matchType = false;
        if (type === "all") {
            matchType = true;
        } else if (type === "anticipation") {
            matchType = !!(t.is_anticipation || desc.startsWith("antecipação:"));
        } else {
            matchType = t.type === type;
        }
        const matchCategory = category === "all" ||
            t.category_id === category ||
            t.category === category ||
            (categories.find(c => c.id === category)?.name === t.category) ||
            (categories.find(c => c.name === category)?.id === t.category_id);
        const isPaid = isTransactionPaid(t);

        if (status === "paid" && !isPaid) return false;
        if (status === "pending" && isPaid) return false;

        return matchSearch && matchType && matchCategory;
    });

    renderTransactions();
}

function openAddTransaction() {
    setQuickType("expense");
    const dateInput = document.getElementById("quickDate");
    if (dateInput) {
        const selDate = getSelectedMonthDate();
        const now = new Date();
        if (selDate.getFullYear() === now.getFullYear() && selDate.getMonth() === now.getMonth()) {
            dateInput.value = now.toISOString().split("T")[0];
        } else {
            const y = selDate.getFullYear();
            const m = String(selDate.getMonth() + 1).padStart(2, "0");
            dateInput.value = `${y}-${m}-01`;
        }
    }
    populateCategoryOptions();
    document.getElementById("quickAddModal")?.classList.add("active");
}

function closeQuickAddModal(e) {
    if (e && e.target !== e.currentTarget && e.target.classList && !e.target.classList.contains("mobile-modal-overlay")) return;
    document.getElementById("quickAddModal")?.classList.remove("active");
}

function setQuickType(type) {
    currentQuickType = type;
    const expBtn = document.getElementById("toggleExpense");
    const incBtn = document.getElementById("toggleIncome");
    const title = document.getElementById("modalTitle");

    if (type === "expense") {
        expBtn?.classList.add("active");
        incBtn?.classList.remove("active");
        if (title) title.textContent = "Nova Despesa";
    } else {
        incBtn?.classList.add("active");
        expBtn?.classList.remove("active");
        if (title) title.textContent = "Nova Receita";
    }
    populateCategoryOptions();
}

function populateCategoryOptions() {
    const select = document.getElementById("quickCategory");
    if (!select) return;
    const filtered = categories.filter(c => !c.type || c.type === currentQuickType);
    select.innerHTML = '<option value="">Selecione a categoria...</option>' +
        (filtered.length > 0 ? filtered : categories).map(c => `<option value="${c.id}">${c.name}</option>`).join("");
}

async function handleQuickAddSubmit(event) {
    event.preventDefault();
    const btn = document.getElementById("quickSubmitBtn");
    const desc = document.getElementById("quickDesc").value.trim();
    const amount = parseFloat(document.getElementById("quickAmount").value);
    const category_id = document.getElementById("quickCategory").value;
    const date = document.getElementById("quickDate").value;

    if (!desc || isNaN(amount) || amount <= 0 || !category_id || !date) {
        showToast("Preencha todos os campos corretamente!", "error");
        return;
    }

    if (window.safeHaptic) window.safeHaptic(25);

    btn.disabled = true;
    btn.textContent = "Salvando...";

    const payload = {
        user_id: currentUser.id,
        description: desc,
        amount: amount,
        type: currentQuickType,
        category_id: category_id,
        date: date
    };

    try {
        const genUuid = () => {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) {}
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        };

        const txId = genUuid();
        const offlineTx = {
            id: txId,
            ...payload,
            created_at: new Date().toISOString()
        };
        allTransactions.unshift(offlineTx);

        if (window.tonuSync && currentUser?.id) {
            await window.tonuSync.setCachedTransactions(currentUser.id, allTransactions);
            await window.tonuSync.enqueue('INSERT_TRANSACTION', offlineTx);
        }

        showToast("Transação adicionada com sucesso! 🎉", "success");

        closeQuickAddModal();
        document.getElementById("quickAddForm").reset();
        await loadTransactions();

        if (currentQuickType === 'expense' && window.TonuBudget && currentUser) {
            const catObj = categories.find(c => c.id === category_id);
            window.TonuBudget.checkLimitAfterTransaction(
                currentUser.id,
                { type: 'expense', amount, category_id, category: catObj?.name, date },
                allTransactions,
                categories
            );
        }
        if (typeof window.checkNotifications === 'function') {
            window.checkNotifications();
        }
    } catch (err) {
        console.error("Erro ao salvar:", err);
        showToast("Erro ao salvar: " + (err.message || "Tente novamente"), "error");
    } finally {
        btn.disabled = false;
        btn.textContent = "Salvar Transação";
    }
}

async function deleteTransaction(id) {
    const target = allTransactions.find(t => String(t.id) === String(id));
    let seriesInfo = { fromNow: [], all: [] };
    if (target) {
        if (typeof window.getFullSeriesInfo === 'function') {
            seriesInfo = await window.getFullSeriesInfo(target, allTransactions, { userId: currentUser?.id });
        } else if (typeof window.findSeriesInfo === 'function') {
            seriesInfo = window.findSeriesInfo(target, allTransactions);
        } else if (typeof window.findRemainingSeries === 'function') {
            const rem = window.findRemainingSeries(target, allTransactions);
            seriesInfo = { fromNow: rem, all: rem };
        }
    }

    let deleteMode = 'single';
    const isAnticipation = !!(target && (target.is_anticipation || (target.description && String(target.description).toLowerCase().startsWith('antecipação:'))));
    let shouldRevertBills = false;

    if (isAnticipation) {
        const match = String(target.description || '').match(/\(([\d,\s]+)\)$/);
        const numsStr = match ? match[1] : '';
        if (!confirm("Deseja realmente excluir esta transação de antecipação?")) return;
        shouldRevertBills = confirm(
            `Esta transação refere-se a uma antecipação de parcelas${numsStr ? ` (${numsStr})` : ''}.\n\n` +
            `Deseja também REVERTER essas parcelas para o estado NÃO PAGO em Contas a Pagar?\n\n` +
            `• OK: Exclui a transação e reverte as parcelas para pendentes.\n` +
            `• Cancelar: Exclui apenas a transação do extrato mantendo as parcelas quitadas.`
        );
    } else if ((seriesInfo.fromNow.length > 0 || seriesInfo.all.length > 0) && typeof window.confirmRecurringDelete === 'function') {
        deleteMode = await window.confirmRecurringDelete({
            countFromNow: seriesInfo.fromNow.length,
            countAll: seriesInfo.all.length,
            itemName: target.description || 'Transação',
            itemType: 'transação'
        });
        if (deleteMode === 'cancel') return;
    } else {
        if (!confirm("Deseja realmente excluir esta transação?")) return;
    }

    try {
        if (shouldRevertBills && typeof window.revertAnticipatedBills === 'function') {
            try {
                const revRes = await window.revertAnticipatedBills(target, { userId: currentUser?.id });
                if (revRes && revRes.revertedCount > 0 && typeof showToast === 'function') {
                    showToast(`${revRes.revertedCount} parcelas foram revertidas para pendentes em Contas! 🔄`, "info");
                }
            } catch (revErr) {
                console.warn('Erro ao reverter parcelas antecipadas:', revErr);
            }
        }

        let idsToDelete = [String(id)];
        if (deleteMode === 'from_now') {
            idsToDelete = [String(id), ...seriesInfo.fromNow.map(r => String(r.id))];
        } else if (deleteMode === 'all_series' || deleteMode === 'all') {
            idsToDelete = [String(id), ...seriesInfo.all.map(r => String(r.id))];
        }

        const idSet = new Set(idsToDelete);
        allTransactions = allTransactions.filter(t => !idSet.has(String(t.id)));

        if (window.tonuSync && currentUser?.id) {
            try {
                const cached = await window.tonuSync.getCachedTransactions(currentUser.id);
                if (Array.isArray(cached)) {
                    const filteredCached = cached.filter(t => !idSet.has(String(t.id)));
                    await window.tonuSync.setCachedTransactions(currentUser.id, filteredCached);
                } else {
                    await window.tonuSync.setCachedTransactions(currentUser.id, allTransactions);
                }
            } catch (_) {}

            for (const delId of idsToDelete) {
                await window.tonuSync.enqueue('DELETE_TRANSACTION', { id: delId });
            }
        }

        if (window.supabaseClient && currentUser?.id && navigator.onLine) {
            try {
                await window.supabaseClient.from('transactions').delete().in('id', idsToDelete).eq('user_id', currentUser.id);
            } catch (supaErr) {
                console.warn('Erro ao remover transações do Supabase:', supaErr);
            }
        }

        const msg = idsToDelete.length > 1
            ? `${idsToDelete.length} transações excluídas com sucesso! 🗑️`
            : "Transação excluída com sucesso! 🗑️";
        showToast(msg, "info");
        await loadTransactions();
    } catch (err) {
        console.error("Erro ao excluir:", err);
        showToast("Erro ao excluir transação.", "error");
    }
}

function formatCurrency(value) {
    if (typeof window.formatCurrency === 'function' && window.formatCurrency !== formatCurrency) {
        return window.formatCurrency(value);
    }
    if (value === null || value === undefined || value === '') value = 0;
    if (typeof value === 'string') {
        const cleaned = value.replace(/[R$\s]/g, '');
        if (cleaned.includes(',') && cleaned.includes('.')) {
            value = cleaned.replace(/\./g, '').replace(',', '.');
        } else if (cleaned.includes(',')) {
            value = cleaned.replace(',', '.');
        }
        value = parseFloat(value);
    }
    const num = Number(value) || 0;
    try {
        const formatted = new Intl.NumberFormat("pt-BR", {
            style: "currency",
            currency: "BRL",
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(num);
        return formatted.replace(/\u00A0/g, ' ');
    } catch {
        const isNegative = num < 0;
        const parts = Math.abs(num).toFixed(2).split('.');
        const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        const res = 'R$ ' + intPart + ',' + parts[1];
        return isNegative ? '-' + res : res;
    }
}

function formatDate(date) {
    if (!date) return "--/--/----";
    const str = String(date).trim();
    const match = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
        return `${match[3]}/${match[2]}/${match[1]}`;
    }
    const d = new Date(str);
    return isNaN(d.getTime()) ? date : d.toLocaleDateString("pt-BR");
}

function exportTransactionsCSV() {
    const txsToExport = (filteredTransactions && filteredTransactions.length > 0)
        ? filteredTransactions
        : allTransactions;

    if (!txsToExport || txsToExport.length === 0) {
        showToast('Nenhuma transação para exportar', 'warning');
        return;
    }

    let csv = '\uFEFF' + ['ID', 'Data', 'Tipo', 'Descricao', 'Valor', 'Categoria', 'Status'].join(';') + '\r\n';
    txsToExport.forEach(t => {
        let cat = null;
        if (t.category_id && categories && categories.length > 0) {
            cat = categories.find(c => c.id === t.category_id);
        }
        if (!cat && t.categories && typeof t.categories === 'object') {
            cat = t.categories;
        }
        const catName = cat?.name || t.category || 'Geral';
        const isPaid = isTransactionPaid(t);
        const row = [
            `"${t.id || ''}"`,
            `"${t.date || ''}"`,
            `"${t.type === 'income' ? 'Receita' : 'Despesa'}"`,
            `"${(t.description || '').replace(/"/g, '""')}"`,
            `"${(Number(t.amount) || 0).toFixed(2).replace('.', ',')}"`,
            `"${catName.replace(/"/g, '""')}"`,
            isPaid ? 'Pago' : 'Pendente'
        ];
        csv += row.join(';') + '\r\n';
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `transacoes_tonucontrole_${new Date().toISOString().split('T')[0]}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Transações exportadas com sucesso! 📄', 'success');
}
window.exportTransactionsCSV = exportTransactionsCSV;

function toggleTheme() {
    if (typeof window.toggleTheme === 'function' && window.toggleTheme !== toggleTheme) {
        return window.toggleTheme();
    }
    const isDark = document.body.classList.toggle("dark-theme");
    localStorage.setItem("tonu_theme", isDark ? "dark" : "light");
    const icon = document.querySelector("#themeIcon");
    if (icon) icon.className = isDark ? "fas fa-sun" : "fas fa-moon";
}
