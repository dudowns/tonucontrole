<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <title>TonuControle - Redirecionando</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #6C5CE7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            text-align: center;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 24px;
        }

        .loader .logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .loader .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #FFEAA7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .loader h1 span {
            color: #FFEAA7;
        }

        .loader p {
            font-size: 13px;
            opacity: 0.8;
        }

        .loader .device-badge {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 14px;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="logo">
            <img src="./icons/logo.png" alt="TonuControle" onerror="this.outerHTML='💰'">
        </div>
        <div class="spinner"></div>
        <h1>Tonu<span>Controle</span></h1>
        <p>Detectando seu dispositivo...</p>
        <div class="device-badge" id="deviceBadge">📱 Carregando...</div>

        <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 240px;">
            <button type="button" onclick="window.location.href='index.html'" style="padding: 10px 14px; background: rgba(255,255,255,0.2); color: #ffffff; border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer;">
                Ir para Login
            </button>
        </div>
    </div>
    <script>
        try {
            sessionStorage.removeItem('tonu_demo_mode');
            localStorage.removeItem('tonu_demo_mode');
        } catch (e) {}
        function isMobile() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const mobileRegex = /Android|iPhone|iPad|iPod|BlackBerry|Windows Phone|webOS|Mobile/i;
            const isSmallScreen = window.innerWidth < 768;
            const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            return mobileRegex.test(ua) || (isSmallScreen && hasTouch);
        }
        function getBasePath() {
            if (window.location.hostname.includes('github.io')) {
                const parts = window.location.pathname.split('/');
                if (parts.length > 1 && parts[1] !== '' && parts[1] !== 'index.html') {
                    return '/' + parts[1];
                }
            }
            return '';
        }
        function redirect() {
            const basePath = getBasePath();
            const isMobileDevice = isMobile();
            const badge = document.getElementById('deviceBadge');
            if (badge) {
                badge.textContent = isMobileDevice ? '📱 Versão Mobile' : '💻 Versão Desktop';
            }
            setTimeout(() => {
                const targetUrl = isMobileDevice 
                    ? basePath + '/pages/mobile/dashboard.html'
                    : basePath + '/pages/dashboard.html';
                window.location.href = targetUrl;
            }, 600);
        }
        redirect();
    </script>
</body>

</html>
