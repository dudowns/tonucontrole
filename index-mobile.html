<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4338CA">
    <title>TonuControle - Redirecionando</title>
    <link rel="manifest" href="./manifest.json?v=3.2.1">
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg?v=3.2.1">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-96x96.png?v=3.2.1">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-72x72.png?v=3.2.1">
    <link rel="icon" type="image/png" sizes="128x128" href="./icons/icon-128x128.png?v=3.2.1">
    <link rel="shortcut icon" href="./icons/icon-128x128.png?v=3.2.1">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192x192.png?v=3.2.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            background:
                radial-gradient(circle at 82% 16%, rgba(16, 185, 129, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 18% 85%, rgba(59, 130, 246, 0.28) 0%, transparent 50%),
                linear-gradient(145deg, #172554 0%, #3730A3 46%, #4338CA 76%, #2563EB 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            text-align: center;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 24px;
        }

        .loader .logo {
            width: 76px;
            height: 76px;
            border-radius: 22px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.14);
            border: 2px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 14px 36px rgba(15, 23, 42, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .loader .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #34D399;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .loader h1 span {
            color: #34D399;
        }

        .loader p {
            font-size: 13px;
            opacity: 0.84;
        }

        .loader .device-badge {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 4px 14px;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="logo">
            <img src="./icons/logo.png?v=3.2.1" alt="TonuControle" onerror="this.outerHTML='💰'">
        </div>
        <div class="spinner"></div>
        <h1>Tonu<span>Controle</span></h1>
        <p>Detectando seu dispositivo...</p>
        <div class="device-badge" id="deviceBadge">📱 Carregando...</div>

        <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 240px;">
            <button type="button" onclick="window.location.href='index.html'" style="padding: 10px 14px; background: rgba(255,255,255,0.2); color: #ffffff; border: 1px solid rgba(255,255,255,0.4); border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer;">
                Ir para Login
            </button>
        </div>
    </div>
    <script>
        try {
            sessionStorage.removeItem('tonu_demo_mode');
            localStorage.removeItem('tonu_demo_mode');
        } catch (e) {}
        function isMobile() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const mobileRegex = /Android|iPhone|iPad|iPod|BlackBerry|Windows Phone|webOS|Mobile/i;
            const isSmallScreen = window.innerWidth < 768;
            const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            return mobileRegex.test(ua) || (isSmallScreen && hasTouch);
        }
        function getBasePath() {
            if (window.location.hostname.includes('github.io')) {
                const parts = window.location.pathname.split('/');
                if (parts.length > 1 && parts[1] !== '' && parts[1] !== 'index.html') {
                    return '/' + parts[1];
                }
            }
            return '';
        }
        function redirect() {
            const basePath = getBasePath();
            const isMobileDevice = isMobile();
            const badge = document.getElementById('deviceBadge');
            if (badge) {
                badge.textContent = isMobileDevice ? '📱 Versão Mobile' : '💻 Versão Desktop';
            }
            setTimeout(() => {
                try {
                    if (sessionStorage.getItem('tonu_user') || localStorage.getItem('tonu_offline_session')) {
                        sessionStorage.setItem('tonu_just_logged_in', JSON.stringify({
                            method: 'session',
                            name: '',
                            ts: Date.now()
                        }));
                    }
                } catch (_) {}
                const targetUrl = isMobileDevice 
                    ? basePath + '/pages/mobile/dashboard.html'
                    : basePath + '/pages/dashboard.html';
                window.location.href = targetUrl;
            }, 600);
        }
        redirect();
    </script>
</body>

</html>
